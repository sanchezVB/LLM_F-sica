# CI — implementa o que DOC-01 §4.3 e DOC-16 §5 descrevem.
#
# Até 2026-08-09 esses documentos afirmavam que o `import-linter` "quebra o
# build" e que a suíte golden bloqueia mudanças em `verify/`. **Não havia
# workflow nenhum.** Esta é a correção.
#
# O que é imposto AGORA está abaixo. O que ainda não é (mypy --strict e
# cobertura de 95% em verify/) está declarado em DOC-16 §5.1 com o prazo, em
# vez de ser prometido e não cumprido.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: lint · fronteiras · testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # ⚠️ 3.12, nao 3.11. O `requirements.lock` fixa `numpy==2.5.1`, que exige
          # Python >= 3.12, entao a instalacao morria em 13 s com
          # "No matching distribution found for numpy==2.5.1" — antes de rodar um
          # unico teste. O CI ficou vermelho assim das 80 execucoes desde que foi
          # criado, em 2026-08-09, ate 2026-08-25.
          #
          # 3.12 tambem e o que a venv de treino usa (o torch-directml exige), entao
          # o CI passa a testar a versao que o projeto de fato roda.
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.lock
          pip install -q ruff import-linter pytest pytest-cov
          # reportlab: `scripts/relatorio_pdf.py` o importa no topo, e um teste de
          # regressao importa esse script. Instalado para o teste RODAR — saltar
          # seria esconder a cobertura em vez de dar a dependencia.
          pip install -q reportlab

      - name: ruff
        run: ruff check src/ tests/ scripts/

      # ── O contrato que sustenta o princípio P3 ──────────────────────────
      # Sem esta imposição o DAG de módulos do DOC-01 §4.3 vira sugestão, e em
      # seis meses `verify/` importa de `training/` — o princípio morre sem
      # ninguém notar, e a recompensa de treino passa a poder divergir do
      # corretor de avaliação.
      - name: fronteiras de módulo
        # ⚠️ `PYTHONPATH=src` como nos passos de teste. Sem ele o import-linter
        # responde "Could not find package 'phifm'" e sai com 1 — o `requirements
        # .lock` instala as dependencias, nao o proprio pacote.
        run: PYTHONPATH=src lint-imports --config pyproject.toml

      - name: testes
        run: PYTHONPATH=src pytest tests/ -q

      # ── DOC-10 §5: a suíte golden é congelada ───────────────────────────
      # Um bug em verify/ é global: o mesmo código filtra dados, calcula
      # recompensa de RLVR, corrige benchmark e checa saída em serving.
      # Qualquer mudança de comportamento sobre os casos golden quebra aqui,
      # mesmo que pareça melhoria.
      - name: suíte golden (bloqueante)
        run: PYTHONPATH=src pytest tests/golden/ -q --tb=short

      - name: cobertura de verify/
        run: |
          PYTHONPATH=src pytest tests/ -q \
            --cov=src/phifm/verify --cov-report=term-missing \
            --cov-fail-under=80
        # Piso em 80%, não nos 95% que o DOC-10 §10 exige. A diferença está
        # declarada em DOC-16 §5.1 como dívida com prazo — prometer 95% e
        # configurar 80% seria pior que declarar os dois números.
