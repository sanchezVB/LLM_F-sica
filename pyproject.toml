[project]
name = "phifm"
version = "0.1.0"
description = "ΦFM — Foundation models especializados em Física"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# Dependências mínimas para reproduzir o Sprint S1 e S2.
# Versões com piso, não fixadas: o `uv.lock`/`requirements.lock` guarda o
# estado exato. Ver DOC-01 §8 — reprodutibilidade de AMBIENTE.
dependencies = [
    "requests>=2.32",
    "pydantic>=2.9",
    "polars>=1.20",
    "pyarrow>=18",
    "blake3>=1.0",
    "scikit-learn>=1.5",
    "sympy>=1.13",
    "mpmath>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phifm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
